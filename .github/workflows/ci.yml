name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:ui
      - run: npm run build
      - name: Read-only smoke (static inspection only)
        run: node --experimental-strip-types src/host/smoke.ts --no-probes --no-wsl
        if: runner.os == 'Windows'
      - name: macOS smoke (real mac facts + live probes)
        run: node --experimental-strip-types src/host/smoke.ts --diagnose-only
        if: runner.os == 'macOS'
      - name: Fault-lab proxy scenarios (platform-neutral env injection)
        run: node --experimental-strip-types scripts/fault-lab.ts S1 S5 S6
        if: runner.os == 'macOS'
